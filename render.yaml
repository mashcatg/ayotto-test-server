services:
  - type: web
    name: ayotto-server
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: smsUrl
        sync: false
      - key: smsApiKey
        sync: false
      - key: smsSenderId
        sync: false
      - key: PORT
        sync: false
